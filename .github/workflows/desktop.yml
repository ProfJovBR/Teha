name: Desktop checks and Windows build
on:
  push:
    branches: [frontend]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python -m pip install pyinstaller==6.11.1
      - run: python -m PyInstaller --noconfirm --windowed --onedir --name Teha main.py
      - uses: actions/upload-artifact@v4
        with:
          name: Teha-Windows
          path: desktop/dist/Teha/
